plugins {
    id 'java'
}

group = 'com.dolgmod'
version = '1.0.0'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://spigotmc.org' }
    maven { url = 'https://sonatype.org' }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}
